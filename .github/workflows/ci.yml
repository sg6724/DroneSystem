name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The lockfile contains platform-specific optional native packages.
        # npm install resolves the runner's Linux variant before lint/build.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
